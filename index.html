<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter WebView</title>
  <script type="text/javascript">
    function sendMessageToFlutter() {
      // Check if Flutter WebView is ready to send a message
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage("Hello from Web!");
      }
    }
  </script>
</head>
<body>
  <h1>Web to Flutter Communication</h1>
  <button onclick="sendMessageToFlutter()">Send Message to Flutter</button>
</body>
</html>
